[project]
name = "voxagent"
version = "0.1.0"
description = "Local-first Windows voice companion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "onnxruntime>=1.22,<2",
  "pydantic>=2.11,<3",
  "psutil>=6.1,<8",
  "soundfile>=0.13,<1",
  "typer>=0.15,<1",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
speech = [
  "onnxruntime==1.27.0; sys_platform == 'win32'",
  "sherpa-onnx==1.13.6",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
voxagent = "voxagent.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "local_vad_smoke: explicitly enabled local Silero VAD integration smoke",
  "model: explicitly enabled local embedding model integration smoke",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
